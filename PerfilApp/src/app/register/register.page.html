<ion-header>
  <ion-toolbar>
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Nombre</ion-label>
    <ion-input type="text" [(ngModel)]="nombre" autocomplete="name" />
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Correo</ion-label>
    <ion-input type="email" [(ngModel)]="email" autocomplete="email" />
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Contraseña</ion-label>
    <ion-input type="password" [(ngModel)]="password" autocomplete="new-password" />
  </ion-item>

  @if (error()) {
    <ion-text color="danger">
      <p>{{ error() }}</p>
    </ion-text>
  }

  <ion-button expand="block" class="ion-margin-top" [disabled]="cargando()" (click)="registrar()">
    @if (cargando()) {
      <ion-spinner name="dots" />
    } @else {
      Crear cuenta
    }
  </ion-button>

  <ion-button expand="block" fill="clear" routerLink="/login">
    Ya tengo cuenta, iniciar sesión
  </ion-button>
</ion-content>
